[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rowless-dbt"
version = "0.0.0.dev0"
description = "dbt integration for rowless: manifest schemas, model discovery, no credentials."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Kauvin Lucas", email = "kauvinlucas@gmail.com" }]
dependencies = [
    "rowless",
    # For resolving a model that declares no columns, by running its compiled
    # SQL, and for the one sqlglot-to-IR type mapping in the workspace, which
    # `rowless_dbt.dtypes` delegates to rather than keeping a second copy of.
    # Reading the manifest itself needs nothing but stdlib json.
    "rowless-sql",
]

[project.optional-dependencies]
# Only needed to *run* dbt. Reading a manifest needs nothing but stdlib json,
# which is what keeps `rowless check` credential-free in CI.
core = ["dbt-core>=1.8"]

[project.entry-points."rowless.sources"]
dbt = "rowless_dbt.source:DbtManifestSource"

[project.entry-points."rowless.discovery"]
dbt = "rowless_dbt.discovery:DbtModelDiscovery"

[tool.hatch.build.targets.wheel]
packages = ["src/rowless_dbt"]

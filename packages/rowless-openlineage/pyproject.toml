[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rowless-openlineage"
version = "0.0.0.dev0"
description = "Emit rowless column lineage as OpenLineage events."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Kauvin Lucas", email = "kauvinlucas@gmail.com" }]
dependencies = [
    "rowless",
    "openlineage-python>=1.20",
]

[project.entry-points."rowless.emitters"]
openlineage = "rowless_openlineage.emitter:OpenLineageEmitter"

[tool.hatch.build.targets.wheel]
packages = ["src/rowless_openlineage"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rowless-pytest"
version = "0.0.0.dev0"
description = "pytest plugin for rowless: millisecond schema contract tests."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Kauvin Lucas", email = "kauvinlucas@gmail.com" }]
dependencies = [
    "rowless",
    "pytest>=8.0",
]

[project.entry-points.pytest11]
rowless = "rowless_pytest.plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/rowless_pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rowless-lsp"
version = "0.0.0.dev0"
description = "Language server for rowless: schema diagnostics and inline hints."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Kauvin Lucas", email = "kauvinlucas@gmail.com" }]
dependencies = [
    "rowless",
    "pygls>=1.3",
]

[project.scripts]
rowless-lsp = "rowless_lsp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rowless_lsp"]
